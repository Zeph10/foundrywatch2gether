# Development-only lab for the AI vocal separation feature. Not part of the module.
# Run by hand ("Run workflow"). mode=tools gathers the ONNX runtime, model parameters, CORS checks and
# into a temporary pre-release named "lab-tools"; mode=cleanup deletes it.
name: AI lab (development)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "tools, eval or cleanup"
        required: true
        default: "tools"

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Clean up
        if: inputs.mode == 'cleanup'
        run: gh release delete lab-tools --yes --cleanup-tag || true

      - uses: actions/setup-node@v4
        if: inputs.mode == 'tools'
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        if: inputs.mode == 'tools'
        with: { python-version: "3.11" }

      - name: ONNX Runtime web build
        if: inputs.mode == 'tools'
        run: |
          mkdir -p lab && cd lab
          {
            npm pack onnxruntime-web@1.20.1 2>&1
            ls -la
            TGZ=$(ls onnxruntime-web-*.tgz | head -1)
            tar -xzf "$TGZ"
            ls package | tee pkg-files.txt
            ls -la package/dist | tee ort-files.txt
            LIC=$(ls package | grep -i -E '^licen[cs]e' | head -1)
            tar -czf ort-web-1.20.1-dist.tgz -C package dist $LIC
            ls -la ort-web-1.20.1-dist.tgz
          } 2>&1 | tee -a lab.log

      - name: Model parameters and download sources (CORS)
        if: always() && inputs.mode == 'tools'
        run: |
          cd lab
          curl -fsSL https://raw.githubusercontent.com/TRvlvr/application_data/main/mdx_model_data/model_data.json -o model_data.json || echo '{}' > model_data.json
          curl -fsSL https://raw.githubusercontent.com/TRvlvr/application_data/main/mdx_model_data/model_name_mapper.json -o model_name_mapper.json || echo '{}' > model_name_mapper.json
          curl -fsSL -o inst.onnx https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/UVR-MDX-NET-Inst_HQ_3.onnx
          python - <<'PY'
          import hashlib, json
          data = open('inst.onnx', 'rb').read()
          # UVR identifies models by the MD5 of the last 10 000 × 1024 bytes (or the whole file if smaller).
          tail = data[-10000 * 1024:] if len(data) > 10000 * 1024 else data
          h = hashlib.md5(tail).hexdigest()
          md = json.load(open('model_data.json'))
          names = json.load(open('model_name_mapper.json'))
          out = {"hash": h, "params": md.get(h), "size": len(data), "md5_full": hashlib.md5(data).hexdigest(),
                 "inst_like": {k: v for k, v in md.items() if isinstance(v, dict) and v.get('mdx_dim_f_set') == 3072 and v.get('mdx_n_fft_scale_set') == 6144},
                 "names_with_inst": {k: v for k, v in names.items() if 'Inst' in str(v)}}
          json.dump(out, open('model-params.json', 'w'), indent=1)
          print(json.dumps(out, indent=1)[:3000])
          PY
          # Which download sources let a browser fetch the model from another site?
          python - <<'PY' > cors.json
          import json, subprocess, urllib.request
          def head(url):
              r = subprocess.run(['curl', '-sSIL', '-H', 'Origin: https://vtt.example.com', '--max-time', '30', url], capture_output=True, text=True)
              hdr = r.stdout.lower()
              return {"url": url, "acao_lines": [l for l in hdr.splitlines() if l.startswith('access-control-allow-origin')],
                      "status_lines": [l for l in hdr.splitlines() if l.startswith('http/')], "length": [l for l in hdr.splitlines() if l.startswith('content-length')][-1:]}
          results = [head('https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/UVR-MDX-NET-Inst_HQ_3.onnx')]
          try:
              found = json.load(urllib.request.urlopen('https://huggingface.co/api/models?search=UVR&limit=100&full=true'))
          except Exception as e:
              found = []; results.append({"hf_search_error": str(e)})
          for m in found:
              for s in m.get('siblings', []):
                  name = s.get('rfilename', '')
                  if name.endswith('UVR-MDX-NET-Inst_HQ_3.onnx') or name.endswith('Kim_Vocal_2.onnx') or name.endswith('UVR-MDX-NET-Voc_FT.onnx'):
                      results.append(head(f"https://huggingface.co/{m['id']}/resolve/main/{name}"))
          for f in ['ort.webgpu.min.mjs', 'ort-wasm-simd-threaded.jsep.wasm', 'ort-wasm-simd-threaded.wasm']:
              results.append(head(f'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/{f}'))
          print(json.dumps(results, indent=1))
          PY
          cat cors.json | head -150

      - name: Evaluate separation on real songs (MUSDB18 previews; audio stays on this runner)
        if: inputs.mode == 'eval'
        run: |
          sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true
          pip install --quiet musdb soundfile numpy
          mkdir -p evalsite/songs evalsite/module && cd evalsite
          cp ../.github/lab/ai-eval.html ../.github/lab/ai-eval.mjs ../.github/lab/serve.mjs .
          cp -r ../scripts module/scripts
          npm init -y >/dev/null && npm install --silent onnxruntime-web@1.20.1 playwright@1.56.0
          npx playwright install --with-deps chromium >/dev/null
          cp -r node_modules/onnxruntime-web/dist ort
          curl -fsSL -o model.onnx https://huggingface.co/nomadkaraoke/public_uvr_models/resolve/main/UVR-MDX-NET-Inst_HQ_3.onnx
          echo "317554b07fe1ea5279a77f2b1520a41ea4b93432560c4ffd08792c30fddf9adc  model.onnx" | sha256sum -c
          python - <<'PY'
          import musdb, soundfile as sf, numpy as np, json
          db = musdb.DB(download=True, subsets='test')
          picked = []
          for track in db.tracks:
              voc = track.targets['vocals'].audio
              if np.sqrt(np.mean(voc ** 2)) < 0.03: continue
              name = ''.join(c if c.isalnum() else '_' for c in track.name)[:40]
              for stem, audio in [('mix', track.audio), ('vocals', voc), ('accompaniment', track.targets['accompaniment'].audio)]:
                  sf.write(f'songs/{name}.{stem}.wav', audio, track.rate, subtype='FLOAT')
              picked.append(name)
              if len(picked) == 5: break
          json.dump(picked, open('songs/index.json', 'w')); print(picked)
          PY
          (node serve.mjs "$PWD" 8800 &) ; sleep 2
          node ai-eval.mjs 8800 ../lab-eval.json
          cd .. && mkdir -p lab && mv lab-eval.json lab/eval.json

      - name: Publish evaluation
        if: always() && inputs.mode == 'eval'
        run: |
          mkdir -p lab && test -f lab/eval.json || echo '{"error":"evaluation did not finish"}' > lab/eval.json
          gh release upload lab-tools lab/eval.json --clobber

      - name: Publish lab pre-release
        if: always() && inputs.mode == 'tools'
        run: |
          gh release delete lab-tools --yes --cleanup-tag || true
          mkdir -p lab && cd lab
          touch lab.log
          FILES=$(ls ort-web-1.20.1-dist.tgz ort-files.txt pkg-files.txt model-params.json cors.json lab.log 2>/dev/null)
          gh release create lab-tools --prerelease --title "Lab tools (development only, will be deleted)" \
            --notes "Temporary files for developing AI vocal separation. Not part of the module." $FILES
