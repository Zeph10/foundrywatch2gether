# Builds a Foundry-installable release when you push a version tag (git tag v1.3.2 && git push --tags)
# or publish a GitHub release with such a tag. The workflow stamps the version and this repository's
# URLs into module.json, zips the module, and creates the release (or attaches to it) with both files.
#
# Manifest URL to paste into Foundry (always points at the newest release):
#   https://github.com/<you>/<repo>/releases/latest/download/module.json
name: Release module

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test tests/*.mjs

      - name: Stamp version and URLs into module.json
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          BASE="https://github.com/${REPO}"
          jq --arg v "$VERSION" --arg base "$BASE" --arg tag "$TAG" '
            .version = $v
            | .url = $base
            | .manifest = ($base + "/releases/latest/download/module.json")
            | .download = ($base + "/releases/download/" + $tag + "/module.zip")
            | .bugs = ($base + "/issues")
            | .readme = ($base + "/blob/main/README.md")
            | .changelog = ($base + "/blob/main/CHANGELOG.md")
          ' module.json > module.tmp && mv module.tmp module.json
          cat module.json

      - name: Build module.zip
        run: zip -r module.zip module.json README.md CHANGELOG.md scripts styles

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" module.json module.zip --clobber
          else
            gh release create "$TAG" module.json module.zip --title "$TAG" \
              --notes "Install in Foundry with this manifest URL: https://github.com/${REPO}/releases/latest/download/module.json — see CHANGELOG.md for changes."
          fi
