# Publishes a Foundry-installable release automatically.
#
# To release: bump "version" in module.json (e.g. 1.3.2), update CHANGELOG.md, and push to main.
# If no release exists for that version yet, this workflow runs the tests, stamps this repository's
# URLs into module.json, zips the module, and creates release vX.Y.Z with module.json + module.zip.
# You can also run it by hand from the Actions tab ("Run workflow").
#
# Manifest URL to paste into Foundry (always points at the newest release):
#   https://github.com/<you>/<repo>/releases/latest/download/module.json
name: Release module

on:
  push:
    branches: [main]
    paths: [module.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version module.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists; nothing to publish. Bump the version in module.json to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.meta.outputs.exists == 'false'
        run: node --test tests/*.mjs

      - name: Stamp this repository's URLs into module.json
        if: steps.meta.outputs.exists == 'false'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/${REPO}"
          jq --arg base "$BASE" --arg tag "$TAG" '
            .url = $base
            | .manifest = ($base + "/releases/latest/download/module.json")
            | .download = ($base + "/releases/download/" + $tag + "/module.zip")
            | .bugs = ($base + "/issues")
            | .readme = ($base + "/blob/main/README.md")
            | .changelog = ($base + "/blob/main/CHANGELOG.md")
          ' module.json > module.tmp && mv module.tmp module.json
          cat module.json

      - name: Bundle the MP3 encoder (lamejs 1.2.1, LGPL-3.0)
        if: steps.meta.outputs.exists == 'false'
        run: |
          mkdir -p vendor/lamejs
          npm pack lamejs@1.2.1 --silent
          tar -xzf lamejs-1.2.1.tgz
          if [ -f package/lame.min.js ]; then cp package/lame.min.js vendor/lamejs/lame.min.js; else cp package/lame.all.js vendor/lamejs/lame.min.js; fi
          cp package/LICENSE vendor/lamejs/LICENSE 2>/dev/null || true
          # Full licence texts: LGPL-3.0 builds on GPL-3.0, so ship both.
          curl -fsSL https://www.gnu.org/licenses/lgpl-3.0.txt -o vendor/lamejs/COPYING.LESSER
          curl -fsSL https://www.gnu.org/licenses/gpl-3.0.txt -o vendor/lamejs/COPYING
          grep -q "GNU LESSER GENERAL PUBLIC LICENSE" vendor/lamejs/COPYING.LESSER
          printf 'lamejs 1.2.1 (https://github.com/zhuker/lamejs), unmodified, licensed under the GNU LGPL v3 (see COPYING.LESSER and COPYING).\nSource: https://github.com/zhuker/lamejs/tree/v1.2.1 and https://www.npmjs.com/package/lamejs/v/1.2.1\nUsed only by the Watch Room converter for MP3 encoding; you may replace this file with any compatible lamejs build.\n' > vendor/lamejs/README.txt
          rm -rf package lamejs-1.2.1.tgz
          ls -la vendor/lamejs
          node -e "const code=require('fs').readFileSync('vendor/lamejs/lame.min.js','utf8'); const lib=new Function(code+';return typeof lamejs!==\"undefined\"?lamejs:globalThis.lamejs;')(); if(!lib||!lib.Mp3Encoder) throw new Error('lamejs did not expose Mp3Encoder'); const e=new lib.Mp3Encoder(2,44100,128); const s=new Int16Array(1152*10); const out=e.encodeBuffer(s,s); console.log('lamejs OK, frame bytes', out.length + e.flush().length);"

      - name: Build module.zip
        if: steps.meta.outputs.exists == 'false'
        run: zip -r module.zip module.json README.md CHANGELOG.md scripts styles templates vendor

      - name: Create release
        if: steps.meta.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" module.json module.zip --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Install in Foundry with this manifest URL: https://github.com/${REPO}/releases/latest/download/module.json — see CHANGELOG.md for what changed."
