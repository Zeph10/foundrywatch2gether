# Publishes a Foundry-installable release automatically.
#
# To release: bump "version" in module.json (e.g. 1.3.2), update CHANGELOG.md, and push to main.
# If no release exists for that version yet, this workflow runs the tests, stamps this repository's
# URLs into module.json, zips the module, and creates release vX.Y.Z with module.json + module.zip.
# You can also run it by hand from the Actions tab ("Run workflow").
#
# Manifest URL to paste into Foundry (always points at the newest release):
#   https://github.com/<you>/<repo>/releases/latest/download/module.json
name: Release module

on:
  push:
    branches: [main]
    paths: [module.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version module.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists; nothing to publish. Bump the version in module.json to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.meta.outputs.exists == 'false'
        run: node --test tests/*.mjs

      - name: Stamp this repository's URLs into module.json
        if: steps.meta.outputs.exists == 'false'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/${REPO}"
          jq --arg base "$BASE" --arg tag "$TAG" '
            .url = $base
            | .manifest = ($base + "/releases/latest/download/module.json")
            | .download = ($base + "/releases/download/" + $tag + "/module.zip")
            | .bugs = ($base + "/issues")
            | .readme = ($base + "/blob/main/README.md")
            | .changelog = ($base + "/blob/main/CHANGELOG.md")
          ' module.json > module.tmp && mv module.tmp module.json
          cat module.json

      - name: Build module.zip
        if: steps.meta.outputs.exists == 'false'
        run: zip -r module.zip module.json README.md CHANGELOG.md scripts styles templates

      - name: Create release
        if: steps.meta.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" module.json module.zip --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Install in Foundry with this manifest URL: https://github.com/${REPO}/releases/latest/download/module.json — see CHANGELOG.md for what changed."
